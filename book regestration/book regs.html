<!DOCTYPE html>
<html>
<head>
    <title>Readers' Haven - Book Registration & Order Form</title>
</head>

<body>

    <h1>Readers' Haven - Book Registration & Order Form</h1>

    <form>

       
        <h2>Customer Details</h2>

        <label for="name">Customer Name:</label>
        <input type="text" id="name" name="customer_name"
               placeholder="Enter your full name" required>
        <br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email address" required>
        <br><br>

        <label for="mobile">Mobile Number:</label>
        <input type="tel" id="mobile" name="mobile"
               placeholder="Enter your mobile number" required>
        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="1" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>


       
        <h2>Delivery Details</h2>

        <label for="date">Delivery Date:</label>
        <input type="date" id="date" name="delivery_date" required>
        <br><br>

        <label for="time">Preferred Delivery Time:</label>
        <input type="time" id="time" name="delivery_time" required>
        <br><br>

        <label for="address">Delivery Address:</label><br>
        <textarea id="address" name="delivery_address"
                  rows="4" cols="40"
                  placeholder="Enter your complete delivery address"
                  required></textarea>
        <br><br>


       
        <h2>Book Preferences</h2>

        <label for="category">Favorite Book Category:</label>
        <select id="category" name="book_category" required>
            <option value="">-- Select a category --</option>
            <option value="fiction">Fiction</option>
            <option value="science">Science</option>
            <option value="history">History</option>
            <option value="children">Children's Books</option>
        </select>
        <br><br>

        <label for="book">Book Title:</label>
        <input type="text" id="book" name="book_title"
               placeholder="Enter book title" required>
        <br><br>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity"
               min="1" value="1" required>
        <br><br>


       
        <h2>Preferred Payment Method</h2>

        <input type="radio" id="cod" name="payment_method"
               value="cash_on_delivery" required>
        <label for="cod">Cash on Delivery</label>

        <input type="radio" id="online" name="payment_method"
               value="online_payment">
        <label for="online">Online Payment</label>
        <br><br>


       
        <h2>Additional Services</h2>

        <input type="checkbox" id="gift" name="services[]" value="gift_wrapping">
        <label for="gift">Gift Wrapping</label>
        <br>

        <input type="checkbox" id="bookmark" name="services[]" value="bookmark">
        <label for="bookmark">Bookmark</label>
        <br>

        <input type="checkbox" id="express" name="services[]" value="express_delivery">
        <label for="express">Express Delivery</label>
        <br>

        <input type="checkbox" id="card" name="services[]" value="greeting_card">
        <label for="card">Greeting Card</label>
        <br><br>


       
        <input type="hidden" name="order_type"
               value="Readers Haven Book Order">


       
        <h2>Reference Document/Image</h2>

        <label for="reference">Upload Reference:</label>
        <input type="file" id="reference" name="reference_file"
               accept="image/*,.pdf,.doc,.docx">
        <br><br>


       
        <h2>Special Instructions</h2>

        <textarea id="instructions" name="special_instructions"
                  rows="5" cols="40"
                  placeholder="Enter any special delivery or order instructions"></textarea>
        <br><br>


       
        <button type="submit">Submit Order</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
