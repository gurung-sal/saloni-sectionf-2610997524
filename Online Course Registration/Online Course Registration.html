<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Student Information Form</title>
</head>
<body >
    <h2> ---------------------------------------------------------------------------------Online Course Registration-----------------------------------------------------------------------</h2>
<form>
<input type="text" disable hidden value="Online Course Registration">
<label for="cs" name="student name"> •Student Name</label>
<input type="text" id="cs" required placeholder="Name">
<br>
<label for="ba" > •Age</label>
<input type="number" id="ba" placeholder="00">
<br>
<label for="em">•Email ID</label>
<input type="email" id="em" required placeholder="xyz@gmail.com">
<br>
<label for="nu"> •Mobile Number</label>
<input id="nu" type="number" required placeholder="-">
<br>
<label for="ss"> •Password</label>
<input id="ss" type="password" required placeholder="******">
<br>
<label for="te"> •Date Of Birth</label>
<input id="te" type="date">
<br>
<label for="cl"> •Preferred Class Time</label>
<input id="cl" type="time">
<br>
<label> <b>•Gender</b></label>
<br>
<input type="radio" name="a">
<label > Male</label>
<br>
<input type="radio" name="a">
<label> Female</label>
<br>
<input type="radio" name="a">
<label> Other</label>
<br>
<label > <b>•Skills</b></label> 
<br>
<input type="checkbox" >
<label> HTML</label> 
<br>
<input type="checkbox">
<label> CSS</label>
<br>
<input type="checkbox">
<label> JavaScript</label>
<br>
<input type="checkbox">
<label> Python</label>
<br>
<label> <b>•Courses</b></label>
<select required>
    <option value=""> --Select A Course--</option>
    <option value="web development"> Web Development</option>
    <option value="python programming"> Python Programming</option>
    <option value="data analytics"> Data Analytics</option>
    <option value="digital marketing"> Digital Marketing</option>
</select>
<br>
<label> <b>•Address :</b></label><br>
<textarea rows="5" cols="50" maxlength="100" minlength="5" placeholder="Write Address Here"></textarea>
<br>
<label> <b>•Additional Information :</b></label><br>
<textarea rows="5" cols="50" maxlength="100" minlength="5" placeholder="Write Additional Information Here"></textarea>
<br>
<label for="he"> <b>•Upload File :</b></label><br>
<input type="file" id="he">
<br>
<br>
<input type="submit">
<br>
<br>
<input type="reset">


</form>
</body>
</html>
