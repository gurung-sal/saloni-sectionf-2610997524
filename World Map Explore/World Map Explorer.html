<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Map Explorer</title>
</head>
<body>
<img src="map.jpg"
     alt="World Map"
     width="1200"
     height="600"
     usemap="#worldmap">

<map name="worldmap">


    <area shape="circle"
          coords="382,152,30"
          href="https://en.wikipedia.org/wiki/Europe"
          alt="Europe continent"
          target="_blank">
    <area shape="rect"
          coords="895,350,1070,500"
          href="https://en.wikipedia.org/wiki/Australia"
          alt="Australia continent"
          target="_blank">


    <area shape="poly"
          coords="90,140,145,95,235,80,300,115,335,175,300,220,245,205,215,260,160,245,125,205"
          href="https://en.wikipedia.org/wiki/North_America"
          alt="North America continent"
          target="_blank">


    <area shape="poly"
          coords="285,285,330,300,350,360,335,430,295,515,260,450,270,390,245,340"
          href="https://en.wikipedia.org/wiki/South_America"
          alt="South America continent"
          target="_blank">


    <area shape="poly"
          coords="500,205,565,185,625,220,645,300,615,395,550,445,500,365,485,280"
          href="https://en.wikipedia.org/wiki/Africa"
          alt="Africa continent"
          target="_blank">

    <area shape="poly"
          coords="625,115,710,80,825,95,940,125,1035,180,985,235,890,220,820,250,740,220,665,180"
          href="https://en.wikipedia.org/wiki/Asia"
          alt="Asia continent"
          target="_blank">


    <area shape="default"
          href="https://en.wikipedia.org/wiki/World"
          alt="World map default region"
          target="_blank">

</map>
</body>
</html>
